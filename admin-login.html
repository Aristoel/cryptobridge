<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CryptoBridge Admin Login</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #07111f;
      color: white;
      font-family: Arial, sans-serif;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: #0d1b2a;
      border: 1px solid #1e3a56;
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 20px 50px rgba(0,0,0,.35);
    }

    h1 {
      margin-top: 0;
      text-align: center;
    }

    .subtitle {
      text-align: center;
      color: #9db3c8;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 14px;
      border-radius: 10px;
      border: 1px solid #34516b;
      background: #081522;
      color: white;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 10px;
      background: #42a5ff;
      color: #06111d;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      color: #ff8a8a;
      min-height: 20px;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>CryptoBridge</h1>

    <div class="subtitle">
      Secure Admin Login
    </div>

    <form id="loginForm">
      <input
        id="email"
        type="email"
        placeholder="Admin email"
        required
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        required
      >

      <button type="submit">
        Sign In
      </button>
    </form>

    <div id="message"></div>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.0.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword
    } from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";


    // PASTE YOUR FIREBASE CONFIG HERE
    // For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDKUPvV2wIhijzT62_XtvexU0p2UQWRfdw",
  authDomain: "cryptobridge-4a3a6.firebaseapp.com",
  projectId: "cryptobridge-4a3a6",
  storageBucket: "cryptobridge-4a3a6.firebasestorage.app",
  messagingSenderId: "624814116103",
  appId: "1:624814116103:web:1b87e97b2e4a0f8fa289a2",
  measurementId: "G-4KTBME35NJ"
};


    const app = initializeApp(firebaseConfig);

    const auth = getAuth(app);


    document
      .getElementById("loginForm")
      .addEventListener("submit", async (event) => {

        event.preventDefault();

        const email =
          document.getElementById("email").value.trim();

        const password =
          document.getElementById("password").value;

        const message =
          document.getElementById("message");

        message.textContent = "Signing in...";

        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );

          window.location.href = "admin.html";

        } catch (error) {

          message.textContent =
            "Invalid email or password.";

          console.error(error);

        }

      });

  </script>

</body>
  </html>
